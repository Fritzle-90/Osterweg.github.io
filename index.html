<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Osterweg</title>
  <meta name="theme-color" content="#1f6feb" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Leaflet (Karte) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #fafafa; }
    header { padding: 14px 16px; background: #1f6feb; color: white; }
    main { padding: 16px; display: grid; gap: 14px; max-width: 780px; margin: 0 auto; }
    .card { background: white; border: 1px solid #e6e6e6; border-radius: 14px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .stations { display: grid; gap: 10px; }
    .small { color: #555; font-size: 14px; line-height: 1.3; }
    .btn { background: #1f6feb; color: #fff; padding: 10px 12px; border: 0; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; }
    .btn:active { transform: translateY(1px); }
    #map { height: 320px; border-radius: 12px; overflow: hidden; }
    audio { width: 100%; margin-top: 10px; }
    .row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .title { font-weight: 800; margin: 0 0 6px; }
  </style>
</head>

<body>
<header>
  <div style="font-size:18px;font-weight:800;">Osterweg</div>
  <div class="small" style="color:#dbe9ff;">Station wählen → Audio abspielen (optional offline speichern)</div>
</header>

<main>
  <div class="card">
    <div class="title">Karte</div>
    <div id="map"></div>
    <div class="small" style="margin-top:8px;">Marker antippen, um Station zu sehen.</div>
  </div>

  <div class="card">
    <div class="title">Offline</div>
    <button id="offlineBtn" class="btn">Audios offline bereitstellen</button>
    <div id="offlineHint" class="small" style="margin-top:8px;">
      Tipp: Einmal im WLAN drücken, dann funktionieren die MP3s auch ohne Empfang.
    </div>
  </div>

  <div class="card">
    <div class="title">Stationen</div>
    <div id="stations" class="stations"></div>
  </div>
</main>

<script>
  // ✅ HIER eure 8 Stationen eintragen:
  // Koordinaten: Google Maps → Stelle lange antippen → Koordinaten kopieren
  const STATIONS = [
    {
      id: 1,
      title: "Station 1 – Start",
      text: "Kurzer Text zur Station 1.",
      lat: 48.590022,
      lng: 8.412674,
      audioUrl: "audio/station1.mp3"
    },
    {
      id: 2,
      title: "Station 2",
      text: "Kurzer Text zur Station 2.",
      lat: 52.5210,
      lng: 13.4060,
      audioUrl: "audio/station2.mp3"
    },
    {
      id: 3,
      title: "Station 3",
      text: "Kurzer Text zur Station 2.",
      lat: 52.5210,
      lng: 13.4060,
      audioUrl: "audio/station3.mp3"
    },
    {
      id: 4,
      title: "Station 4",
      text: "Kurzer Text zur Station 2.",
      lat: 52.5210,
      lng: 13.4060,
      audioUrl: "audio/station4.mp3"
    },
    {
      id: 5,
      title: "Station 5",
      text: "Kurzer Text zur Station 5.",
      lat: 52.5210,
      lng: 13.4060,
      audioUrl: "audio/station2.mp3"
    },
    {
      id: 6,
      title: "Station 6",
      text: "Kurzer Text zur Station 2.",
      lat: 52.5210,
      lng: 13.4060,
      audioUrl: "audio/station6.mp3"
    },
    {
      id: 7,
      title: "Station 7",
      text: "Kurzer Text zur Station 2.",
      lat: 52.5210,
      lng: 13.4060,
      audioUrl: "audio/station7.mp3"
    },
    {
      id: 8,
      title: "Station 2",
      text: "Kurzer Text zur Station 8.",
      lat: 52.5210,
      lng: 13.4060,
      audioUrl: "audio/station8.mp3"
    },
    // ... bis Station 8
  ];

  // --- Liste rendern ---
  const stationsEl = document.getElementById("stations");

  function makeStationCard(st) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="row">
        <div>
          <div style="font-weight:800;">${st.title}</div>
          <div class="small">${st.text}</div>
        </div>
        <div class="small" style="white-space:nowrap;color:#1f6feb;font-weight:700;">#${st.id}</div>
      </div>
      <audio controls preload="none" src="${st.audioUrl}"></audio>
    `;
    return div;
  }

  STATIONS.forEach(st => stationsEl.appendChild(makeStationCard(st)));

  // --- Karte ---
  const map = L.map('map');

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const latlngs = STATIONS
    .filter(s => typeof s.lat === "number" && typeof s.lng === "number")
    .map(s => [s.lat, s.lng]);

  if (latlngs.length) {
    map.fitBounds(latlngs, { padding: [20, 20] });

    // Route Linie (Wegverlauf)
    L.polyline(latlngs).addTo(map);

    // Marker
    STATIONS.forEach(st => {
      if (typeof st.lat !== "number" || typeof st.lng !== "number") return;
      L.marker([st.lat, st.lng]).addTo(map)
        .bindPopup(`<b>${st.title}</b><br>${st.text}`);
    });
  } else {
    // Fallback, falls noch keine Koordinaten eingetragen sind:
    map.setView([52.52, 13.405], 13);
  }

  // --- PWA: Service Worker registrieren ---
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }

  // --- Offline Button: alle Audios einmalig cachen ---
  const offlineBtn = document.getElementById("offlineBtn");
  const offlineHint = document.getElementById("offlineHint");

  offlineBtn.addEventListener("click", async () => {
    if (!("serviceWorker" in navigator)) {
      offlineHint.textContent = "Offline-Funktion nicht verfügbar.";
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const urls = STATIONS.map(s => s.audioUrl).filter(Boolean);

    reg.active?.postMessage({ type: "CACHE_ALL_AUDIO", urls });

    offlineHint.textContent = "Download gestartet. Bitte WLAN anlassen, bis alles geladen ist.";
  });
</script>
</body>
</html>
